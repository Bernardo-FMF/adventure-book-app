<main
  class="flex min-h-dvh flex-col items-center justify-center bg-[radial-gradient(ellipse_at_center,var(--color-hero-light)_0%,var(--color-hero)_70%)] px-6 py-16 text-center"
>
  <h1
    class="flex items-center justify-center gap-4 font-display text-3xl font-bold tracking-tight text-gold-400 sm:text-4xl lg:text-5xl"
  >
    <ng-icon name="phosphorSparkleLight" aria-hidden="true" />
    Greetings, Adventurer
    <ng-icon name="phosphorSparkleLight" aria-hidden="true" />
  </h1>
  <p class="mx-auto mt-5 max-w-md text-base leading-relaxed text-parchment/85 sm:text-lg">
    What is your name?
  </p>

  <form class="mt-10 w-full max-w-md" (submit)="onSubmit($event)" novalidate>
    <label class="relative block">
      <span class="sr-only">Your adventurer name</span>

      <ng-icon
        name="phosphorUserLight"
        class="pointer-events-none absolute top-1/2 left-4 -translate-y-1/2 text-ink-faint"
        aria-hidden="true"
      />

      <input
        type="text"
        name="adventurer"
        autocomplete="nickname"
        placeholder="Enter your name..."
        maxlength="80"
        [value]="name()"
        (input)="onInput($event)"
        [attr.aria-invalid]="invalid() ? 'true' : null"
        [attr.aria-describedby]="invalid() ? 'name-error' : error() ? 'submit-error' : null"
        class="w-full rounded-xl bg-parchment-dim py-3 pr-5 pl-12 text-base text-ink focus:outline-2 focus:outline-offset-2 focus:outline-gold-400"
      />
    </label>

    @if (invalid()) {
      <p id="name-error" role="alert" class="mt-3 text-sm font-semibold text-parchment">
        Every adventurer needs a name.
      </p>
    }

    @if (error(); as message) {
      <p id="submit-error" role="alert" class="mt-3 text-sm leading-relaxed text-parchment">{{ message }}</p>
    }

    <button
      type="submit"
      class="mt-6 w-full rounded-lg bg-gold-500 px-4 py-3 font-semibold text-white transition hover:bg-gold-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gold-400"
    >
      Begin Your Journey
    </button>
  </form>
</main>
