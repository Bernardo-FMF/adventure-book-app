<button
  type="button"
  [disabled]="disabled()"
  class="flex w-full items-start gap-4 rounded-xl bg-parchment/60 p-4 text-left ring-1 ring-ink/10 transition hover:bg-gold-400/10 hover:ring-gold-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gold-600 disabled:cursor-not-allowed disabled:opacity-60"
  (click)="chosen.emit()"
>
  <span
    class="mt-0.5 flex size-6 shrink-0 items-center justify-center rounded-full bg-ink text-xs font-bold text-parchment"
    aria-hidden="true"
  >
    {{ position() }}
  </span>
  <span class="font-display text-base text-ink">{{ description() }}</span>
</button>
