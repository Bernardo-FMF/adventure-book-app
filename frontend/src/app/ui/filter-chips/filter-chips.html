<ul class="flex flex-wrap items-center gap-2">
  @for (option of options(); track option) {
    <li>
      <button
        type="button"
        class="rounded-full px-4 py-1.5 text-xs font-bold transition"
        [class]="isSelected(option) ? 'bg-gold-500 text-white' : 'bg-parchment-dim text-ink hover:bg-gold-400/30'"
        (click)="toggled.emit(option)"
      >
        {{ option | enumLabel }}
      </button>
    </li>
  }
</ul>
